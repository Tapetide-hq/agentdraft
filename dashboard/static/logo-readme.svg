<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="agentdraft">
  <!-- README / docs variant. Same mark, but the tile sits one step above the app
       background and the edge is a light stroke, because this renders on GitHub's WHITE
       or dark canvas rather than on our own black nav: a #0a0a0a tile with a #2a2a2a
       edge disappears on both. Rounded (unlike icon.svg) since nothing crops it here.
       NOTE: no double hyphen anywhere in this comment. XML forbids it, and writing the
       CSS variable name for the background here made librsvg reject the whole file. -->
  <rect width="32" height="32" rx="7" fill="#141414"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.4" fill="none"
        stroke="rgba(255,255,255,0.26)" stroke-width="1.5"/>
  <g fill="#ffffff">
    <rect x="6" y="6" width="20" height="4"/>
    <rect x="6" y="14" width="20" height="4"/>
  </g>
  <rect x="6" y="22" width="10" height="4" fill="#d6f520"/>
</svg>
