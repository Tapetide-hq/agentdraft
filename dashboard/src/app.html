<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Icons. Order matters: a browser picks the LAST rel="icon" it understands, so the
         SVG comes after the .ico and modern browsers get the scalable one while older
         ones (and Windows shortcuts / RSS readers) fall back to the multi-res .ico. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <!-- White canvas + white sticky nav: browser chrome matches. Must equal the manifest's
         theme_color and THEME in scripts/verify_icons.py, which asserts all three agree. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
