version: 2

project_name: webhost

before:
  hooks:
    - go mod tidy

builds:
  - id: webhost
    main: .
    binary: webhost
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Tapetide-hq/webhost/cli/internal/version.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: Tapetide-hq
    name: webhost
