version: 2

project_name: agentdraft

# Every release carries two tags on the same commit: v<semver> (this config, install.sh)
# and cli/v<semver> (Go module proxy, because the module lives in cli/). Without this
# goreleaser may treat cli/vX as the "previous" tag and emit an empty changelog.
git:
  ignore_tags:
    - "cli/*"

before:
  hooks:
    - go mod tidy

builds:
  - id: agentdraft
    main: .
    binary: agentdraft
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Tapetide-hq/agentdraft/cli/internal/version.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: Tapetide-hq
    name: agentdraft
  prerelease: auto
