name: Dependabot

# Squash-merges a Dependabot PR that bumps a PATCH or MINOR version once every other
# check on the PR has passed. Majors stay open for a human, because those are the ones
# that actually break things.
#
# Why not `gh pr merge --auto` plus required status checks? The CI workflows here are
# path-filtered (a /dashboard bump only runs dashboard.yml), and a required check that
# never starts blocks the PR forever. So this job waits for whatever checks DID start on
# the commit, excluding itself, and merges only when all of them succeeded.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.repository == 'Tapetide-hq/agentdraft'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch | version-update:semver-minor) echo "merge=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "merge=false" >> "$GITHUB_OUTPUT"; echo "::notice::$UPDATE_TYPE — leaving for a human" ;;
          esac

      - name: Wait for the PR's other checks
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: ${{ github.job }}
        run: |
          set -eu
          # Sibling workflows are triggered by the same event and register their check
          # runs within seconds; give them a head start so an empty list is not mistaken
          # for "nothing to wait for".
          sleep 90
          for _ in $(seq 1 80); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name != \"$SELF\")]")
            pending=$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(printf '%s' "$runs" | jq '[.[] | select(.status == "completed" and ((.conclusion // "") | IN("success","skipped","neutral") | not))] | length')
            total=$(printf '%s' "$runs" | jq 'length')
            echo "checks: $total total, $pending pending, $failed failed"
            if [ "$failed" != 0 ]; then
              printf '%s' "$runs" | jq -r '.[] | select(.status == "completed" and ((.conclusion // "") | IN("success","skipped","neutral") | not)) | "::error::\(.name): \(.conclusion)"'
              exit 1
            fi
            [ "$pending" = 0 ] && exit 0
            sleep 30
          done
          echo "::error::checks still pending after 40 minutes"; exit 1

      - name: Approve and squash-merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" --body "Patch/minor bump with green checks; auto-merging."
          gh pr merge --squash "$PR_URL"
