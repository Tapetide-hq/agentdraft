name: Workflows

# actionlint catches the mistakes that only surface when a workflow actually runs:
# a typo in a `needs:` name, an expression that never evaluates true, a shell step
# that shellcheck would reject. Cheap to run, painful to discover in a release.

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
